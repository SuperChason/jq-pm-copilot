name: Validate

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version:
          - "3.11"
          - "3.13"

    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Validate Skill suite
        run: python3 scripts/validate-suite.py

      - name: Run unit and consistency tests
        run: python3 -m unittest discover -s tests -v

      - name: Build deterministic release packages
        run: python3 scripts/build-release.py

      - name: Verify release checksums
        working-directory: dist
        run: shasum -a 256 -c SHA256SUMS.txt

      - name: Test release archives
        run: |
          for package in dist/*.zip; do
            unzip -t "$package"
          done

      - name: Validate extracted main package
        run: |
          package=$(find dist -maxdepth 1 -name 'jq-pm-copilot-v*.zip' -print -quit)
          extract_dir=$(mktemp -d)
          unzip -q "$package" -d "$extract_dir"
          package_root=$(find "$extract_dir" -mindepth 1 -maxdepth 1 -type d -print -quit)
          python3 "$package_root/scripts/validate-suite.py"
          python3 -m unittest discover -s "$package_root/tests" -v

      - name: Check whitespace errors
        run: git diff --check
